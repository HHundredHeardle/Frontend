name: Flutter Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --dart-define=COMMIT_HASH=${{ github.sha }} --dart-define=BACKEND_URL=${{ secrets.BACKEND_URL }}
        if: github.ref == 'refs/heads/main'
      - name: Upload artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: build/web
